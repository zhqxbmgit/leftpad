<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>LeftPad Dreamscape Logs</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://leftpad-shared.local/shell.css">
</head>
<body>
  <div id="viewport">
    <main id="design-root" aria-label="LeftPad DS4 接收器日志">
      <img id="static-art" class="scene-art" src="static-art.png" alt="Dreamscape 日志建筑场景">
      <div id="dreamscape-shell" data-active-page="logs"></div>

      <div id="connection-pill" class="connection-pill" aria-live="polite">
        <span id="connection-dot"></span>
        <span id="connection-state">等待连接</span>
      </div>

      <section class="log-shell" aria-label="接收器运行日志">
        <div id="log-view" class="log-view" tabindex="0" role="log" aria-live="polite" aria-relevant="additions text"></div>
        <button id="latest-marker" class="latest-marker" type="button" data-pending="false" aria-label="回到最新日志">
          <i aria-hidden="true"></i><span>最新</span>
        </button>
      </section>

    </main>
  </div>
  <script src="https://leftpad-shared.local/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
