<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>LeftPad Dreamscape Settings</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://leftpad-shared.local/shell.css">
</head>
<body>
  <div id="viewport">
    <main id="design-root" aria-label="LeftPad DS4 接收器设置页面">
      <img class="scene-art" src="static-art.png" alt="梦境建筑设置场景">
      <div id="dreamscape-shell" data-active-page="settings"></div>

      <header class="page-title">设置</header>
      <div class="connection-pill" aria-live="polite">
        <span id="connection-dot"></span><span id="connection-status">等待连接</span>
      </div>

      <nav class="settings-tabs" aria-label="设置分类">
        <span class="basic-indicator-cover" aria-hidden="true"></span>
        <button class="settings-tab active" data-command="showSettingsBasic" style="--x:332px;--w:160px">基础</button>
        <button class="settings-tab" data-command="showSettingsMappings" style="--x:492px;--w:180px">动作映射</button>
        <svg class="mapping-tab-spark" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 1 18 10 27 14 18 18 14 27 10 18 1 14 10 10Z"/></svg>
      </nav>

      <section id="settings-form" aria-label="基础设置">
        <h2 class="setting-section-title" style="--x:350px;--y:282px">环形菜单</h2>
        <div class="setting-row select-row" style="--x:350px;--y:325px;--w:555px">
          <label for="visual-pack">视觉主题</label>
          <select id="visual-pack" class="premium-select" data-field="visualPackId"></select>
        </div>
        <div class="setting-row slider-row left-row" style="--x:350px;--y:425px;--w:545px">
          <label for="overall-size">菜单大小</label>
          <output id="overall-size-value" for="overall-size"></output>
          <input id="overall-size" type="range" data-field="overallSizePercent">
        </div>
        <div class="setting-row slider-row left-row" style="--x:350px;--y:535px;--w:545px">
          <label for="font-size">字体大小</label>
          <output id="font-size-value" for="font-size"></output>
          <input id="font-size" type="range" data-field="fontSize">
        </div>

        <h2 class="setting-section-title" style="--x:963px;--y:282px">操作</h2>
        <div class="setting-row slider-row right-row" style="--x:963px;--y:325px;--w:501px">
          <label for="double-tap">双击判定时间</label>
          <output id="double-tap-value" for="double-tap"></output>
          <input id="double-tap" type="range" data-field="doubleTapWindowMs">
          <small class="setting-help">数值越大，第二次点击允许的间隔越长。</small>
        </div>
        <div class="setting-row slider-row right-row" style="--x:963px;--y:455px;--w:501px">
          <label for="dead-zone">中心死区 (px)</label>
          <output id="dead-zone-value" for="dead-zone"></output>
          <input id="dead-zone" type="range" data-field="selectionDeadZone">
        </div>

        <h2 class="setting-section-title receiver-section-title" style="--x:963px;--y:574px">接收器界面</h2>
        <p class="receiver-section-note">仅调整接收器窗口，不改变环形菜单画面。</p>
        <div class="setting-row select-row receiver-row" style="--x:963px;--y:635px;--w:555px">
          <label for="receiver-scale">接收器界面缩放</label>
          <select id="receiver-scale" class="premium-select" data-field="receiverUiScalePercent"></select>
        </div>
      </section>

      <section id="mapping-section" aria-label="动作映射设置">
        <div class="mapping-content-mask" aria-hidden="true"></div>
        <header class="mapping-heading">
          <span id="mapping-profile-badge">RADIAL</span>
          <strong>动作映射</strong>
          <small id="mapping-caption"></small>
        </header>
        <div id="mapping-grid" aria-label="映射槽位"></div>
        <section id="mapping-detail" aria-label="共享详细动作编辑器"></section>
      </section>

      <section class="settings-actions" aria-label="设置操作">
        <button id="preview-button" class="action-button preview" data-command="settingsPreview">
          <svg aria-hidden="true" viewBox="0 0 32 32"><path d="M3 16s5-8 13-8 13 8 13 8-5 8-13 8S3 16 3 16Zm13 5a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg><span>预览</span>
        </button>
        <button id="hide-preview-button" class="action-button hide" data-command="settingsHidePreview">
          <svg aria-hidden="true" viewBox="0 0 32 32"><path d="m5 4 23 23-2 2-5-5c-1.5.7-3.2 1-5 1C8 25 3 16 3 16a25 25 0 0 1 5-6l-5-4 2-2Zm7 10a5 5 0 0 0 6 6l-6-6Zm4-7c8 0 13 9 13 9a24 24 0 0 1-4 5l-4-4v-1a5 5 0 0 0-5-5h-1l-4-3c1.5-.7 3.2-1 5-1Z"/></svg><span>隐藏预览</span>
        </button>
        <button id="apply-button" class="action-button apply" data-command="settingsApplySave">
          <svg aria-hidden="true" viewBox="0 0 32 32"><path d="M5 4h19l4 4v20H5V4Zm5 3v8h13V7H10Zm2 13v5h9v-5h-9Z"/></svg><span>应用并保存</span>
        </button>
        <button id="restore-button" class="action-button restore" data-command="settingsRestoreDefault">
          <svg aria-hidden="true" viewBox="0 0 32 32"><path d="M8 9a12 12 0 1 1-2 14l4-2a8 8 0 1 0 1-9l4 4H4V5l4 4Z"/></svg><span>恢复默认</span>
        </button>
      </section>

      <output id="status-message" aria-live="polite"></output>
    </main>
  </div>
  <script src="https://leftpad-shared.local/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
