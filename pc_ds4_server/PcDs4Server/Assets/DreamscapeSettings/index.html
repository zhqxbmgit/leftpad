<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>LeftPad Dreamscape Settings</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://leftpad-shared.local/shell.css">
</head>
<body>
  <div id="viewport">
    <main id="design-root" aria-label="LeftPad DS4 接收器设置页面">
      <img class="scene-art" src="static-art.png" alt="梦境建筑设置场景">
      <div id="dreamscape-shell" data-active-page="settings"></div>

      <header class="page-title">设置</header>
      <div class="connection-pill" aria-live="polite">
        <span id="connection-dot"></span><span id="connection-status">等待连接</span>
      </div>

      <nav class="settings-tabs" aria-label="设置分类">
        <span class="basic-indicator-cover" aria-hidden="true"></span>
        <button class="settings-tab active" data-command="showSettingsBasic" style="--x:332px;--w:160px">基础</button>
        <button class="settings-tab" data-command="showSettingsAdvanced" style="--x:492px;--w:139px">高级</button>
        <button class="settings-tab" data-command="showSettingsMappings" style="--x:631px;--w:180px">动作映射</button>
        <svg class="advanced-tab-spark" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 1 18 10 27 14 18 18 14 27 10 18 1 14 10 10Z"/></svg>
        <svg class="mapping-tab-spark" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 1 18 10 27 14 18 18 14 27 10 18 1 14 10 10Z"/></svg>
      </nav>

      <section id="settings-form" aria-label="基础设置">
        <div class="setting-row select-row" style="--x:350px;--y:300px;--w:555px">
          <label for="visual-pack">视觉主题</label>
          <select id="visual-pack" class="premium-select" data-field="visualPackId"></select>
        </div>
        <div class="setting-row select-row" style="--x:350px;--y:385px;--w:555px">
          <label for="receiver-scale">接收器界面缩放</label>
          <select id="receiver-scale" class="premium-select" data-field="receiverUiScalePercent"></select>
        </div>

        <div class="setting-row slider-row left-row" style="--x:350px;--y:477px;--w:545px">
          <label for="overall-size">环形菜单整体大小</label>
          <output id="overall-size-value" for="overall-size"></output>
          <input id="overall-size" type="range" data-field="overallSizePercent">
        </div>
        <div class="setting-row slider-row left-row" style="--x:350px;--y:573px;--w:545px">
          <label for="double-tap">环形菜单双击窗口</label>
          <output id="double-tap-value" for="double-tap"></output>
          <input id="double-tap" type="range" data-field="doubleTapWindowMs">
        </div>
        <div class="setting-row slider-row left-row" style="--x:350px;--y:669px;--w:545px">
          <label for="dead-zone">选择死区 (px)</label>
          <output id="dead-zone-value" for="dead-zone"></output>
          <input id="dead-zone" type="range" data-field="selectionDeadZone">
        </div>

        <div class="setting-row slider-row right-row" style="--x:963px;--y:300px;--w:501px">
          <label for="highlight">选择高亮强度</label>
          <output id="highlight-value" for="highlight"></output>
          <input id="highlight" type="range" data-field="selectedIntensity">
        </div>
        <div class="setting-row slider-row right-row" style="--x:963px;--y:401px;--w:501px">
          <label for="petal-opacity">花瓣透明度 (0-255)</label>
          <output id="petal-opacity-value" for="petal-opacity"></output>
          <input id="petal-opacity" type="range" data-field="petalOpacity">
        </div>
        <div class="setting-row slider-row right-row" style="--x:963px;--y:501px;--w:501px">
          <label for="border-opacity">边框透明度 (0-255)</label>
          <output id="border-opacity-value" for="border-opacity"></output>
          <input id="border-opacity" type="range" data-field="borderOpacity">
        </div>
        <div class="setting-row slider-row right-row" style="--x:963px;--y:601px;--w:501px">
          <label for="text-opacity">文字透明度 (0-255)</label>
          <output id="text-opacity-value" for="text-opacity"></output>
          <input id="text-opacity" type="range" data-field="textOpacity">
        </div>
      </section>

      <section id="advanced-form" aria-label="高级设置">
        <div class="advanced-row advanced-left-row" style="--x:350px;--y:300px;--w:545px">
          <span class="advanced-icon"><svg viewBox="0 0 32 32"><path d="M6 8V5h7v3H9v5H6V8Zm13-3h7v8h-3V8h-4V5ZM6 19h3v5h4v3H6v-8Zm17 0h3v8h-7v-3h4v-5ZM11 11h10v10H11V11Z"/></svg></span>
          <label for="advanced-canvas-size">画布大小</label>
          <output id="advanced-canvas-size-value" for="advanced-canvas-size"></output>
          <input id="advanced-canvas-size" type="range" data-advanced-field="canvasSize">
        </div>
        <div class="advanced-row advanced-left-row" style="--x:350px;--y:400px;--w:545px">
          <span class="advanced-icon"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10"/><circle class="cut" cx="16" cy="16" r="5"/><path d="M15 2h2v5h-2zM15 25h2v5h-2zM2 15h5v2H2zM25 15h5v2h-5z"/></svg></span>
          <label for="advanced-center-radius">中心圆半径</label>
          <output id="advanced-center-radius-value" for="advanced-center-radius"></output>
          <input id="advanced-center-radius" type="range" data-advanced-field="centerRadius">
        </div>
        <div class="advanced-row advanced-left-row" style="--x:350px;--y:500px;--w:545px">
          <span class="advanced-icon"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/><circle class="cut" cx="16" cy="16" r="7"/><circle class="line" cx="16" cy="16" r="3"/></svg></span>
          <label for="advanced-inner-radius">花瓣内半径</label>
          <output id="advanced-inner-radius-value" for="advanced-inner-radius"></output>
          <input id="advanced-inner-radius" type="range" data-advanced-field="petalInnerRadius">
        </div>
        <div class="advanced-row advanced-left-row" style="--x:350px;--y:600px;--w:545px">
          <span class="advanced-icon"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12"/><circle class="cut" cx="16" cy="16" r="9"/><path d="M16 2 19 8 16 10 13 8Z"/></svg></span>
          <label for="advanced-outer-radius">花瓣外半径</label>
          <output id="advanced-outer-radius-value" for="advanced-outer-radius"></output>
          <input id="advanced-outer-radius" type="range" data-advanced-field="petalOuterRadius">
        </div>

        <div class="advanced-row advanced-right-row" style="--x:963px;--y:300px;--w:501px">
          <span class="advanced-icon"><svg viewBox="0 0 32 32"><path d="M7 6h18v4h-7v17h-4V10H7V6Z"/><path d="M25 17a9 9 0 0 1-7 9l-.7-2.5a6.5 6.5 0 0 0 5.2-6.5H19l5-6 5 6h-4Z"/></svg></span>
          <label for="advanced-text-radius">文字位置半径</label>
          <output id="advanced-text-radius-value" for="advanced-text-radius"></output>
          <input id="advanced-text-radius" type="range" data-advanced-field="textRadius">
        </div>
        <div class="advanced-row advanced-right-row" style="--x:963px;--y:400px;--w:501px">
          <span class="advanced-icon"><svg viewBox="0 0 32 32"><path d="M16 16 27 9a13 13 0 0 1 1.5 7H16Z"/><path d="M16 16 5 9a13 13 0 0 0-1.5 7H16Z"/><circle class="cut" cx="16" cy="16" r="4"/></svg></span>
          <label for="advanced-gap">花瓣间隔角度</label>
          <output id="advanced-gap-value" for="advanced-gap"></output>
          <input id="advanced-gap" type="range" data-advanced-field="petalGapDegrees">
        </div>
        <div class="advanced-row advanced-right-row" style="--x:963px;--y:500px;--w:501px">
          <span class="advanced-icon"><svg viewBox="0 0 32 32"><path d="M5 6h22v5h-3V9h-6v18h4v3H10v-3h4V9H8v2H5V6Z"/></svg></span>
          <label for="advanced-font-size">字体大小</label>
          <output id="advanced-font-size-value" for="advanced-font-size"></output>
          <input id="advanced-font-size" type="range" data-advanced-field="fontSize">
        </div>
        <div class="advanced-row advanced-right-row" style="--x:963px;--y:600px;--w:501px">
          <span class="advanced-icon"><svg viewBox="0 0 32 32"><circle cx="16" cy="18" r="10"/><circle class="cut" cx="16" cy="18" r="7"/><path d="M14 2h4v5h-4zM16 11h2v8h-2zM17 17l5 3-1 2-5-3z"/></svg></span>
          <label for="advanced-poll-interval">选择检测间隔</label>
          <output id="advanced-poll-interval-value" for="advanced-poll-interval"></output>
          <input id="advanced-poll-interval" type="range" data-advanced-field="selectionPollIntervalMs">
        </div>
      </section>

      <section id="mapping-section" aria-label="动作映射设置">
        <div class="mapping-content-mask" aria-hidden="true"></div>
        <header class="mapping-heading">
          <span id="mapping-profile-badge">RADIAL</span>
          <strong>动作映射</strong>
          <small id="mapping-caption"></small>
        </header>
        <div id="mapping-grid" aria-label="映射槽位"></div>
        <section id="mapping-detail" aria-label="共享详细动作编辑器"></section>
      </section>

      <section class="settings-actions" aria-label="设置操作">
        <button id="preview-button" class="action-button preview" data-command="settingsPreview">
          <svg aria-hidden="true" viewBox="0 0 32 32"><path d="M3 16s5-8 13-8 13 8 13 8-5 8-13 8S3 16 3 16Zm13 5a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg><span>预览</span>
        </button>
        <button id="hide-preview-button" class="action-button hide" data-command="settingsHidePreview">
          <svg aria-hidden="true" viewBox="0 0 32 32"><path d="m5 4 23 23-2 2-5-5c-1.5.7-3.2 1-5 1C8 25 3 16 3 16a25 25 0 0 1 5-6l-5-4 2-2Zm7 10a5 5 0 0 0 6 6l-6-6Zm4-7c8 0 13 9 13 9a24 24 0 0 1-4 5l-4-4v-1a5 5 0 0 0-5-5h-1l-4-3c1.5-.7 3.2-1 5-1Z"/></svg><span>隐藏预览</span>
        </button>
        <button id="apply-button" class="action-button apply" data-command="settingsApplySave">
          <svg aria-hidden="true" viewBox="0 0 32 32"><path d="M5 4h19l4 4v20H5V4Zm5 3v8h13V7H10Zm2 13v5h9v-5h-9Z"/></svg><span>应用并保存</span>
        </button>
        <button id="restore-button" class="action-button restore" data-command="settingsRestoreDefault">
          <svg aria-hidden="true" viewBox="0 0 32 32"><path d="M8 9a12 12 0 1 1-2 14l4-2a8 8 0 1 0 1-9l4 4H4V5l4 4Z"/></svg><span>恢复默认</span>
        </button>
      </section>

      <output id="status-message" aria-live="polite"></output>
    </main>
  </div>
  <script src="https://leftpad-shared.local/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
