<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>LeftPad Dreamscape Controller Status</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://leftpad-shared.local/shell.css">
</head>
<body>
  <div id="viewport">
    <main id="design-root" aria-label="LeftPad DS4 接收器手柄状态">
      <img id="static-art" class="scene-art" src="static-art.png" alt="Dreamscape 手柄状态建筑场景">
      <div id="dreamscape-shell" data-active-page="controller"></div>

      <div id="connection-pill" class="connection-pill" aria-live="polite">
        <span id="connection-dot"></span>
        <span id="connection-state">等待连接</span>
      </div>

      <section class="diagnostics-surface" aria-label="手柄实时诊断">
        <h2>可视虚拟摇杆</h2>
        <div class="diagnostic-lines">
          <p class="diagnostic-group primary">
            <span class="field"><b>MOVE</b><strong id="move-state">已释放</strong></span>
            <span class="field"><b>模式</b><strong id="mode">已停止</strong></span>
            <span class="field"><b>光标采样</b><strong id="cursor-sampling">未启用</strong></span>
          </p>
          <p class="diagnostic-group">
            <span class="field"><b>本次按住已捕获方向</b><strong id="direction-captured">否</strong></span>
            <span class="field"><b>移动锁定</b><strong id="move-locked">否</strong></span>
          </p>
          <p class="diagnostic-group">
            <span class="field"><b>当前方向</b><strong id="current-direction">0.000 / 0.000</strong></span>
            <span class="field"><b>锁定方向</b><strong id="locked-direction">0.000 / 0.000</strong></span>
          </p>
          <p class="diagnostic-group">
            <span class="field"><b>摇杆</b><strong id="joystick">0.000 / 0.000</strong></span>
            <span class="field"><b>DS4</b><strong id="ds4">128 / 128</strong></span>
          </p>
          <p class="diagnostic-group">
            <span class="field"><b>中心</b><strong id="center">- / -</strong></span>
            <span class="field"><b>当前光标</b><strong id="cursor">- / -</strong></span>
          </p>
        </div>

        <section class="input-monitor" aria-label="手柄输入监视">
          <h2>手柄输入监视</h2>
          <div class="monitor-badges">
            <article class="monitor-badge triangle" data-button="triangle" data-pressed="false">
              <div class="badge-orb"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 13 51 48H13Z"/></svg></div>
              <span class="button-name">Triangle</span><span class="button-state">未按下</span>
            </article>
            <article class="monitor-badge square" data-button="square" data-pressed="false">
              <div class="badge-orb"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="16" width="32" height="32"/></svg></div>
              <span class="button-name">Square</span><span class="button-state">未按下</span>
            </article>
            <article class="monitor-badge cross" data-button="cross" data-pressed="false">
              <div class="badge-orb"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="m18 14 14 14 14-14 4 4-14 14 14 14-4 4-14-14-14 14-4-4 14-14-14-14Z"/></svg></div>
              <span class="button-name">Cross</span><span class="button-state">未按下</span>
            </article>
            <article class="monitor-badge circle" data-button="circle" data-pressed="false">
              <div class="badge-orb"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="19"/></svg></div>
              <span class="button-name">Circle</span><span class="button-state">未按下</span>
            </article>
          </div>
        </section>
      </section>

    </main>
  </div>
  <script src="https://leftpad-shared.local/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
