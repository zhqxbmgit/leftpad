<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>LeftPad Dreamscape Overview Spike</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://leftpad-shared.local/shell.css">
</head>
<body>
  <div id="viewport" aria-label="Dreamscape Overview viewport">
    <main id="design-root" aria-label="LeftPad DS4 接收器总览">
      <img class="scene-art" src="static-art.png" alt="纪念碑谷建筑场景">
      <div id="dreamscape-shell" data-active-page="overview"></div>

      <header class="page-title">控制中心</header>

      <section id="vigem-card" class="status-card status-card-1" aria-label="ViGEmBus 状态">
        <div class="status-label">VIGEMBUS</div>
        <div id="vigem-status" class="status-value">检查中...</div>
        <span id="vigem-dot" class="status-dot"></span>
      </section>
      <section id="virtual-ds4-card" class="status-card status-card-2" aria-label="虚拟 DS4 状态">
        <div class="status-label">虚拟 DS4</div>
        <div id="virtual-ds4-status" class="status-value">未启动</div>
        <span id="virtual-ds4-dot" class="status-dot"></span>
      </section>
      <section id="phone-card" class="status-card status-card-3" aria-label="手机状态">
        <div class="status-label">手机</div>
        <div id="phone-status" class="status-value">等待连接</div>
        <span id="phone-dot" class="status-dot warning"></span>
      </section>
      <section id="port-card" class="status-card status-card-4" aria-label="端口状态">
        <div class="status-label">端口</div>
        <div id="port-status" class="status-value numeric">8888</div>
        <span id="port-dot" class="status-dot"></span>
      </section>

      <section class="output-dynamic" aria-label="输出控制">
        <div class="output-heading">输出模式</div>
        <select id="output-mode" class="output-mode premium-select" aria-label="输出模式" disabled></select>
        <button id="start-stop" class="start-stop" data-command="startStop">
          <img class="stop-glyph" src="button-stop.svg" alt=""><span id="start-stop-label">停止</span>
        </button>
      </section>

      <section id="mapping-values" aria-label="动作映射"></section>

    </main>
  </div>
  <script src="https://leftpad-shared.local/shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
