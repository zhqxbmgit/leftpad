<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dreamscape Controller Status Preview</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="viewport">
    <main id="design-root" aria-label="LeftPad 手柄状态视觉预览">
      <img class="reference-art" src="reference.png" alt="纪念碑谷3静态建筑参考">

      <section class="diagnostics-surface" aria-label="手柄实时诊断">
        <h2>可视虚拟摇杆</h2>
        <div class="diagnostic-lines">
          <p class="diagnostic-group primary"><span class="field"><b>MOVE</b><strong>已释放</strong></span><span class="field"><b>模式</b><strong>已停止</strong></span><span class="field"><b>光标采样</b><strong>未启用</strong></span></p>
          <p class="diagnostic-group"><span class="field"><b>本次按住已捕获方向</b><strong>否</strong></span><span class="field"><b>移动锁定</b><strong>否</strong></span></p>
          <p class="diagnostic-group"><span class="field"><b>当前方向</b><strong>0.000 / 0.000</strong></span><span class="field"><b>锁定方向</b><strong>0.000 / 0.000</strong></span></p>
          <p class="diagnostic-group"><span class="field"><b>摇杆</b><strong>0.000 / 0.000</strong></span><span class="field"><b>DS4</b><strong>128 / 128</strong></span></p>
          <p class="diagnostic-group"><span class="field"><b>中心</b><strong>- / -</strong></span><span class="field"><b>当前光标</b><strong>- / -</strong></span></p>
        </div>

        <section class="input-monitor" aria-label="手柄输入监视">
          <h2>手柄输入监视</h2>
          <div class="monitor-badges">
            <article class="monitor-badge triangle" data-button="Triangle">
              <div class="badge-orb"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 13 51 48H13Z"/></svg></div>
              <span>Triangle</span>
            </article>
            <article class="monitor-badge square" data-button="Square">
              <div class="badge-orb"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="16" width="32" height="32"/></svg></div>
              <span>Square</span>
            </article>
            <article class="monitor-badge cross" data-button="Cross">
              <div class="badge-orb"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="m18 14 14 14 14-14 4 4-14 14 14 14-4 4-14-14-14 14-4-4 14-14-14-14Z"/></svg></div>
              <span>Cross</span>
            </article>
            <article class="monitor-badge circle" data-button="Circle">
              <div class="badge-orb"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="19"/></svg></div>
              <span>Circle</span>
            </article>
          </div>
        </section>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
