<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dreamscape Mapping Options</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,#202e68,#5268a9);font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;color:#fff}.title{height:104px;display:flex;align-items:center;justify-content:center;gap:18px;font-size:32px;font-weight:650;letter-spacing:1px;text-shadow:0 2px 5px rgba(16,24,70,.4)}.title span{font-size:16px;font-weight:400;color:#d9e4ff;padding:7px 13px;border:1px solid rgba(255,255,255,.22);border-radius:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:0 34px}.card{position:relative;height:566px;border:1px solid rgba(255,255,255,.3);border-radius:24px;background:rgba(255,255,255,.09);box-shadow:0 18px 40px rgba(11,17,54,.26);overflow:hidden}.label{height:74px;display:flex;align-items:center;padding:0 27px;font-size:25px;font-weight:650}.label small{margin-left:15px;font-size:15px;font-weight:400;color:#dce5ff}.stage{position:absolute;left:12px;right:12px;top:74px;height:466px;overflow:hidden;border-radius:16px;background:#263772}.stage iframe{position:absolute;left:0;top:0;width:1672px;height:941px;border:0;transform:scale(.4945);transform-origin:0 0}
  </style>
</head>
<body>
  <header class="title">Dreamscape Settings Mapping <span>KeyboardShortcut 编辑密度对比 · Mock only</span></header>
  <main class="grid">
    <section class="card"><div class="label">OPTION A <small>Inline Expansion · 直观</small></div><div class="stage"><iframe src="preview.html?option=a&state=expanded"></iframe></div></section>
    <section class="card"><div class="label">OPTION B <small>Shared Detail Panel · 整洁</small></div><div class="stage"><iframe src="preview.html?option=b&state=expanded"></iframe></div></section>
  </main>
</body>
</html>
